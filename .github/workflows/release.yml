# 설치 파일을 만들어 릴리스에 올린다.
#
# 판 번호를 붙여 밀 때만 돈다. **태그와 tauri.conf.json의 판 번호가 같아야
# 한다** — 다르면 검사에서 걸린다.
#
#     git tag v0.6.0
#     git push origin v0.6.0
#
# 끝나면 GitHub의 Releases에 **초안**이 생긴다. 자동으로 공개하지 않는다 —
# 사람이 설치해 보고 나서 [Publish release]를 눌러야 남에게 보인다.
# 이 앱은 학생 이름을 담으므로, 아무도 안 본 설치 파일이 저절로 공개되는
# 자리를 두지 않는다.
#
# ── 서명에 대하여 ────────────────────────────────────────────
#
# 지금은 서명하지 않는다. 그래서 받는 분이 처음 실행할 때 Windows가
# "PC 보호" 파란 창을 띄운다(추가 정보 → 실행). 그 창을 없애려면 코드
# 서명 인증서가 필요한데, 개인이 받으려면 매년 비용이 들고 신원 확인
# 절차가 있다. `docs/gboard-release.md`에 무엇이 필요한지 적어 두었다.
#
# 인증서가 생기면 여기에 두 줄이 붙는다(그 문서에 적어 두었다).

name: release

on:
  push:
    tags: ['v*']

permissions:
  # 릴리스를 만들려면 쓰기가 필요하다. 그 외에는 아무것도 안 준다.
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 빌드가 이 작업 흐름에서 가장 오래 걸린다. 캐시가 없으면
      # 매번 십 분 넘게 의존성을 다시 컴파일한다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 설치 파일을 만들기 전에 웹 검사를 먼저 통과해야 한다. 여기서
      # 걸리면 Rust 빌드까지 가지 않는다 — 값싼 검사가 먼저다.
      - run: npm run verify

      # 태그와 판 번호가 맞는지도 여기서 본다. v0.7.0을 밀었는데 파일이
      # 0.6.0이면, 받는 분이 덮어씌워도 Windows가 같은 판으로 보고 아무
      # 일도 안 한다. tauri.conf.json의 beforeBuildCommand도 이 검사를
      # 돌리지만 거기서는 태그를 모른다.
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 갱신 서명. 저장소 Settings → Secrets에 넣는다.
          #   TAURI_SIGNING_PRIVATE_KEY          — ~/.tauri/gboard.key 파일의 내용 전체
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — 열쇠 암호(없으면 비워 둔다)
          # 없으면 tauri.conf.json의 createUpdaterArtifacts 때문에 빌드가 여기서 멈춘다.
          # 그게 맞다 — 서명 없는 갱신 파일을 조용히 올리는 것보다 낫다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: G-board ${{ github.ref_name }}
          releaseBody: |
            설치 파일을 받아 더블클릭하시면 됩니다. 계정도 설정값도 없습니다.

            처음 실행할 때 Windows가 "PC 보호" 창을 띄웁니다.
            **추가 정보 → 실행**을 누르시면 됩니다. 서명 인증서가 없어서
            나오는 창이고, 앱에 문제가 있다는 뜻은 아닙니다.

            바뀐 것은 아래 Assets 위의 목록을 보세요.
          # 초안으로 둔다. 사람이 설치해 보고 나서 공개한다.
          releaseDraft: true
          prerelease: false
