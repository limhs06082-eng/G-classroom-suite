[package]
name = "app"
version = "0.14.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# devtools를 껐다. 2판 동안만 켠 것이고, 3판에서 끄기로 적어 두었다.
#
# 켜 두면 안 되는 까닭이 권한에 있다. capabilities/default.json이
# fs:allow-appdata-write-recursive와 fs:allow-remove를 주는데, 개발자
# 도구가 열리면 키보드 앞의 누구나 window.__TAURI__.core.invoke(...)로
# 그 명령을 화면을 거치지 않고 직접 부를 수 있다. 단일 인스턴스 잠금이
# 막으려던 자료 손실이 다른 문으로 열리는 셈이고, 교실 컴퓨터는 아이들이
# 앉는 자리다.
#
# 다시 켜야 할 일이 있으면 features = ["devtools"]로 되돌리되,
# **내보내기 전에 반드시 다시 끈다.** scripts/check-release.mjs가 센다.
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

# 단일 인스턴스 잠금은 모바일에 없는 개념이라 Tauri 문서가 데스크톱
# 타깃에만 걸도록 안내한다. G-board는 데스크톱 전용이지만 그 관례를
# 그대로 따른다.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# 자동 갱신. 새 판을 GitHub Releases의 latest.json에서 찾아 받고, 서명
# (tauri.conf.json의 pubkey)을 확인한 뒤에만 설치한다. 개인 열쇠는
# 저장소에 없다 — 만든 사람의 컴퓨터(~/.tauri)와 GitHub 비밀값에만 있다.
tauri-plugin-updater = "2"
# 갱신을 설치한 뒤 앱을 다시 켜는 데 쓴다(relaunch).
tauri-plugin-process = "2"
